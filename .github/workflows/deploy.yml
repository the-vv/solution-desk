name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: docker/api.Dockerfile
          - name: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/solution-desk-${{ matrix.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/solution-desk-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      VM_PORT: ${{ secrets.VM_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Upload compose file
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -p $VM_PORT -o StrictHostKeyChecking=yes"
          $SSH "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -P "$VM_PORT" -o StrictHostKeyChecking=yes \
            docker-compose.yml "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$DEPLOY_PATH/docker-compose.yml"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VM_PORT" -o StrictHostKeyChecking=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "cd '$DEPLOY_PATH' && IMAGE_TAG='${{ github.sha }}' docker compose pull && IMAGE_TAG='${{ github.sha }}' docker compose up -d --remove-orphans && docker image prune -f"
