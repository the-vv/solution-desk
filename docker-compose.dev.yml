# Local development database only. Run the API and web app with pnpm.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: solution_desk
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: solution_desk
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev-db:/var/lib/postgresql/data
volumes:
  dev-db:
